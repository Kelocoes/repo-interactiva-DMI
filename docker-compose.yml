services:
  postgres:
    image: postgres:16-alpine
    container_name: bocao_postgres
    restart: always
    environment:
      POSTGRES_USER: bocao_user
      POSTGRES_PASSWORD: bocao_password
      POSTGRES_DB: bocao_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
